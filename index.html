<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nissa Rugby — Gestion des séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noir:#16130f; --noir-2:#211c16; --rouge:#c8102e; --rouge-dark:#9c0c24;
    --blanc:#f7f5f0; --blanc-2:#efece4; --pierre:#8a8175; --or:#b08d3e;
    --texte:#1c1a17; --radius:2px; --border:#e2ded4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Archivo',sans-serif; background:var(--blanc); color:var(--texte); line-height:1.5;}
  h1,h2,h3,.display{font-family:'Archivo Expanded',sans-serif; font-weight:800; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input,select,textarea{font-family:inherit;}
  .hidden{display:none !important;}

  header{background:var(--noir); color:var(--blanc); border-bottom:3px solid var(--rouge); padding:12px 28px; display:flex; align-items:center; gap:14px;}
  header img.club-logo{height:44px; width:auto; flex-shrink:0;}
  header .t{font-family:'Archivo Expanded'; font-weight:800; font-size:1.05rem;}
  header .t span{color:var(--rouge);}
  header .sub{font-size:0.72rem; color:var(--pierre); margin-top:1px;}

  .layout{display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 62px);}

  /* SIDEBAR */
  .sidebar{background:var(--noir-2); color:var(--blanc); padding:20px 0; border-right:1px solid #2c2620;}
  .sidebar-head{padding:0 20px 14px; display:flex; justify-content:space-between; align-items:center;}
  .sidebar-head h3{font-size:0.78rem; color:var(--pierre); font-weight:600; letter-spacing:0.02em;}
  .add-btn{width:26px; height:26px; background:var(--rouge); color:var(--blanc); font-size:1.1rem; border-radius:var(--radius); line-height:1;}
  .add-btn:hover{background:var(--rouge-dark);}
  .profile-item{padding:12px 20px; cursor:pointer; border-left:3px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .profile-item:hover{background:rgba(255,255,255,0.04);}
  .profile-item.active{border-left-color:var(--rouge); background:rgba(200,16,46,0.1);}
  .profile-item .name{font-size:0.92rem; font-weight:600;}
  .profile-item .sub{font-size:0.74rem; color:var(--pierre); margin-top:2px;}
  .profile-item .del{opacity:0; font-size:0.9rem; color:var(--pierre); padding:2px 6px;}
  .profile-item:hover .del{opacity:1;}
  .profile-item .del:hover{color:var(--rouge);}
  .empty-sidebar{padding:20px; color:var(--pierre); font-size:0.85rem;}

  /* MAIN */
  main{padding:32px 40px; max-width:920px;}
  .profile-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
  .profile-header h2{font-size:1.7rem; color:var(--noir);}
  .profile-header .meta{color:var(--pierre); font-size:0.92rem; margin-top:6px;}
  .header-actions{display:flex; gap:10px;}
  .btn{padding:10px 18px; border-radius:var(--radius); font-weight:600; font-size:0.9rem;}
  .btn-rouge{background:var(--rouge); color:var(--blanc);}
  .btn-rouge:hover{background:var(--rouge-dark);}
  .btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--texte);}
  .btn-outline:hover{border-color:var(--rouge); color:var(--rouge);}
  .btn-text{background:none; color:var(--pierre); font-size:0.85rem; padding:6px 4px;}
  .btn-text:hover{color:var(--rouge);}

  .no-profile{padding:60px 20px; color:var(--pierre); text-align:center; max-width:400px; margin:60px auto;}
  .no-profile h3{color:var(--noir); font-size:1.2rem; margin-bottom:10px;}

  .seance-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .view-tabs{display:flex; gap:0; border-bottom:2px solid var(--blanc-2);}
  .view-tab-btn{background:none; padding:8px 4px; margin-right:22px; font-size:0.9rem; font-weight:600; color:var(--pierre); border-bottom:2px solid transparent; position:relative; top:2px;}
  .view-tab-btn.active{color:var(--noir); border-bottom-color:var(--rouge);}

  /* CALENDRIER PAR ATHLETE */
  .cal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .cal-month-label{font-weight:700; font-size:1.05rem; color:var(--noir); text-transform:capitalize;}
  .cal-nav-btn{background:none; border:1px solid var(--border); width:34px; height:34px; font-size:1.1rem; color:var(--noir); border-radius:var(--radius);}
  .cal-nav-btn:hover{border-color:var(--rouge); color:var(--rouge);}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px;}
  .cal-weekdays span{text-align:center; font-size:0.74rem; color:var(--pierre); font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:520px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:0.85rem; border:1px solid var(--border); color:var(--texte); cursor:pointer;}
  .cal-cell.empty{border:none; cursor:default;}
  .cal-cell.today{border-color:var(--noir); border-width:1.5px; font-weight:700;}
  .cal-cell.selected{background:var(--rouge); border-color:var(--rouge); color:var(--blanc);}
  .cal-dots{display:flex; gap:2px; height:6px;}
  .cal-dot{width:5px; height:5px; border-radius:50%;}
  .cal-dot.bar-Musculation{background:var(--rouge);} .cal-cell.selected .cal-dot.bar-Musculation{background:var(--blanc);}
  .cal-dot.bar-Terrain{background:var(--noir);} .cal-cell.selected .cal-dot.bar-Terrain{background:var(--blanc);}
  .cal-dot.bar-Recuperation{background:var(--or);}
  .cal-dot.bar-Video{background:var(--pierre);}
  .seance-toolbar h3{font-size:1rem; color:var(--noir);}
  .seance-count{color:var(--pierre); font-size:0.85rem;}

  .seance-list{display:flex; flex-direction:column; gap:10px;}
  .seance-row{border:1px solid var(--border); background:var(--blanc);}
  .seance-row-head{display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer;}
  .seance-bar{width:5px; align-self:stretch; flex-shrink:0;}
  .bar-Musculation{background:var(--rouge);} .bar-Terrain{background:var(--noir);} .bar-Recuperation{background:var(--or);} .bar-Video{background:var(--pierre);}
  .seance-row-head .info{flex:1;}
  .seance-row-head .titre{font-weight:600; font-size:0.98rem; color:var(--noir);}
  .seance-row-head .meta-line{font-size:0.82rem; color:var(--pierre); margin-top:3px;}
  .type-chip{font-size:0.72rem; font-weight:600; padding:4px 10px; background:var(--blanc-2); color:var(--noir); border-radius:var(--radius); flex-shrink:0;}
  .chevron{color:var(--pierre); font-size:0.8rem; transition:transform .15s ease; flex-shrink:0;}
  .seance-row.open .chevron{transform:rotate(90deg);}
  .seance-detail{display:none; padding:0 18px 18px 23px; border-top:1px solid var(--blanc-2);}
  .seance-row.open .seance-detail{display:block;}
  .seance-detail .objectif{color:var(--texte); font-size:0.9rem; margin:14px 0; padding:12px 16px; background:var(--blanc-2); border-left:3px solid var(--rouge);}
  .exo-mini{display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--blanc-2); font-size:0.87rem;}
  .exo-mini:last-of-type{border-bottom:none;}
  .exo-mini .n{font-family:'Archivo Expanded'; color:var(--rouge); font-weight:700; width:28px; flex-shrink:0;}
  .exo-mini .nom{width:170px; flex-shrink:0; font-weight:600;}
  .exo-mini .vol{width:110px; flex-shrink:0; color:var(--pierre);}
  .exo-mini .cons{color:var(--pierre);}
  .row-actions{display:flex; gap:16px; margin-top:14px;}
  .empty-state{padding:40px 0; color:var(--pierre); text-align:center; font-size:0.92rem;}

  /* MODAL */
  .overlay{position:fixed; inset:0; background:rgba(22,19,15,0.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:100;}
  .modal{background:var(--blanc); width:100%; max-width:560px; border-top:4px solid var(--rouge); padding:32px 36px 36px;}
  .modal h3{font-size:1.3rem; color:var(--noir); margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.8rem; font-weight:600; color:var(--pierre); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--border); background:var(--blanc);
    font-size:0.92rem; border-radius:var(--radius);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--rouge);}
  .field textarea{min-height:70px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .exo-editor-row{border:1px solid var(--border); padding:14px; margin-bottom:10px; position:relative;}
  .exo-editor-row.is-superset{border-left:3px solid var(--rouge); margin-top:-1px;}
  .exo-editor-row .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .exo-editor-row .remove-exo{position:absolute; top:8px; right:8px; color:var(--pierre); font-size:0.85rem; background:none; padding:4px 8px;}
  .exo-editor-row .remove-exo:hover{color:var(--rouge);}
  .exo-editor-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .exo-order-badge{background:var(--rouge); color:var(--blanc); font-family:'Archivo Expanded'; font-weight:700; font-size:0.82rem; padding:3px 9px; border-radius:var(--radius); flex-shrink:0;}
  .superset-toggle{display:flex; align-items:center; gap:6px; font-size:0.83rem; color:var(--pierre); cursor:pointer;}
  .superset-toggle input{width:14px; height:14px; cursor:pointer;}
  .superset-toggle.disabled{opacity:0.4; pointer-events:none;}
  .add-exo-btn{background:none; color:var(--rouge); font-weight:600; font-size:0.88rem; padding:8px 0;}

  .modal-actions{display:flex; justify-content:flex-end; gap:12px; margin-top:26px;}

  .copy-athlete-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); margin-bottom:8px; cursor:pointer;}
  .copy-athlete-item:hover{border-color:var(--pierre);}
  .copy-athlete-item input{width:16px; height:16px; flex-shrink:0; cursor:pointer;}
  .copy-athlete-item .name{font-weight:600; font-size:0.92rem; color:var(--noir);}
  .copy-athlete-item .sub{font-size:0.78rem; color:var(--pierre); margin-top:2px;}
  .copy-empty{color:var(--pierre); font-size:0.88rem; padding:10px 0;}
</style>
</head>

<script>
// ===================== CONNEXION BASE DE DONNEES =====================
const SUPABASE_URL = 'https://wfllyusgbtarbctdcmgo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmbGx5dXNnYnRhcmJjdGRjbWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MjIxMjEsImV4cCI6MjEwMjE5ODEyMX0.UqQisIQrVY7xQwxaTkdfTNqEFTTGDi0QIEB_XZ21MiI';
const DATA_ROW_ID = 'nissa_coaching_seances';

async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.${DATA_ROW_ID}&select=data`, {
      headers:{ apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if(rows.length && rows[0].data && rows[0].data.profiles){
      return rows[0].data.profiles;
    }
  }catch(err){ console.error('Chargement impossible, utilisation des données par défaut', err); }
  return null;
}

let saveTimer = null;
function saveData(){
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = 'Enregistrement…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
        method:'POST',
        headers:{
          apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({id: DATA_ROW_ID, data:{profiles}, updated_at: new Date().toISOString()})

      if(statusEl) statusEl.textContent = 'Enregistré ✓';
    }catch(err){
      console.error(err);
      if(statusEl) statusEl.textContent = 'Échec de l\'enregistrement — vérifiez la connexion';
    }
  }, 400);
}

// Calcule les étiquettes d'ordre (A, B, C… ou A1/A2 si superset) pour une liste d'exercices
function computeExoLabels(list){
  const groups = [];
  list.forEach(ex => {
    if(ex.superset && groups.length > 0){
      groups[groups.length - 1].push(ex);
    } else {
      groups.push([ex]);
    }
  });
  const labels = [];
  groups.forEach((group, gi) => {
    const letter = String.fromCharCode(65 + gi);
    if(group.length === 1){
      labels.push(letter);
    } else {
      group.forEach((_, si) => labels.push(letter + (si + 1)));
    }
  });
  return labels;
}

function typeLabel(t){ return {Musculation:'Musculation', Terrain:'Terrain', Recuperation:'Récupération', Video:'Vidéo'}[t] || t; }

// ===================== CALENDRIER PAR ATHLETE =====================
function pad2(n){ return String(n).padStart(2,'0'); }

function renderCalendarView(profile){
  const container = document.getElementById('seanceList');
  container.className = '';
  const todayStr = new Date().toISOString().slice(0,10);
  const seancesByDate = {};
  profile.seances.forEach(s => { (seancesByDate[s.date] = seancesByDate[s.date] || []).push(s); });

  const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const firstWeekday = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  let cellsHtml = '';
  for(let i = 0; i < firstWeekday; i++){ cellsHtml += '<div class="cal-cell empty"></div>'; }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`;
    const daySeances = seancesByDate[dateStr] || [];
    const types = [...new Set(daySeances.map(s => s.type))];
    const classes = ['cal-cell'];
    if(dateStr === todayStr) classes.push('today');
    if(dateStr === calSelectedDate) classes.push('selected');
    cellsHtml += `
      <div class="${classes.join(' ')}" data-date="${dateStr}">
        <span>${d}</span>
        <div class="cal-dots">${types.map(t => `<span class="cal-dot bar-${t}"></span>`).join('')}</div>
      </div>`;
  }

  container.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="cal-nav-btn" id="calNext">›</button>
    </div>
    <div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="cal-grid">${cellsHtml}</div>
    <div id="calDayPanel" style="margin-top:24px;"></div>
  `;
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendarView(profile);
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendarView(profile);
  });
  container.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      calSelectedDate = cell.dataset.date === calSelectedDate ? null : cell.dataset.date;
      renderCalendarView(profile);
    });
  });

  const panel = document.getElementById('calDayPanel');
  if(calSelectedDate){
    const dayList = (seancesByDate[calSelectedDate] || []).sort((a,b) => a.heure.localeCompare(b.heure));
    const heading = document.createElement('div');
    heading.style.cssText = 'font-weight:700; color:var(--noir); font-size:0.95rem; margin-bottom:12px; text-transform:capitalize;';
    heading.textContent = new Date(calSelectedDate+'T00:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'long'});
    panel.appendChild(heading);
    const list = document.createElement('div');
    list.className = 'seance-list';
    panel.appendChild(list);
    renderSeanceRows(list, dayList);
  } else {
    panel.innerHTML = '<div class="empty-state">Touche un jour pour voir ses séances.</div>';
  }
}

function openSeanceModal(id){
  editingSeanceId = id;
  const modal = document.getElementById('seanceModal');
  const profile = currentProfile();

    const s = profile.seances.find(x => x.id === id);

document.getElementById('seanceCancel').addEventListener('click', () => document.getElementById('seanceModal').classList.add('hidden'));

function renderExoEditor(){
  const container = document.getElementById('exoEditorList');
  container.innerHTML = '';
  const labels = computeExoLabels(exoDraft);
  exoDraft.forEach((ex, i) => {
    const row = document.createElement('div');
    row.className = 'exo-editor-row' + (ex.superset ? ' is-superset' : '');
    row.innerHTML = `
      ${exoDraft.length > 1 ? '<button class="remove-exo" type="button">✕</button>' : ''}
      <div class="exo-editor-head">
        <span class="exo-order-badge">${labels[i]}</span>
        <label class="superset-toggle${i === 0 ? ' disabled' : ''}">
          <input type="checkbox" data-superset ${ex.superset ? 'checked' : ''} ${i === 0 ? 'disabled' : ''}>
          Superset avec l'exercice précédent
        </label>
      </div>
      <div class="field-row3">
        <div class="field" style="margin-bottom:0;"><label>Exercice</label><input type="text" value="${ex.nom}" data-k="nom" placeholder="Ex. Squat arrière"></div>
        <div class="field" style="margin-bottom:0;"><label>Volume</label><input type="text" value="${ex.volume}" data-k="volume" placeholder="Ex. 4 x 8"></div>
        <div class="field" style="margin-bottom:0;"><label>Consigne</label><input type="text" value="${ex.consigne}" data-k="consigne" placeholder="Ex. Contrôle en descente"></div>
      </div>`;
    row.querySelectorAll('input[data-k]').forEach(inp => {
      inp.addEventListener('input', () => { exoDraft[i][inp.dataset.k] = inp.value; });
    });
    const supersetInp = row.querySelector('input[data-superset]');
    if(supersetInp){
      supersetInp.addEventListener('change', () => {
        exoDraft[i].superset = supersetInp.checked;
        renderExoEditor();
      });
    }
    const removeBtn = row.querySelector('.remove-exo');
    if(removeBtn) removeBtn.addEventListener('click', () => { exoDraft.splice(i,1); renderExoEditor(); });
    container.appendChild(row);
  });
}
document.getElementById('addExoBtn').addEventListener('click', () => {
  exoDraft.push({nom:'', volume:'', consigne:'', superset:false});
  renderExoEditor();
});

document.getElementById('seanceSave').addEventListener('click', () => {
  const titre = document.getElementById('scTitre').value.trim();
  const date = document.getElementById('scDate').value;
  if(!titre || !date){ alert('Le titre et la date sont obligatoires.'); return; }
  const heure = document.getElementById('scHeure').value;
  const type = document.getElementById('scType').value;
  const objectif = document.getElementById('scObjectif').value.trim();
  const exercices = exoDraft.filter(e => e.nom.trim() !== '');

  const profile = currentProfile();
  if(editingSeanceId){
    const s = profile.seances.find(x => x.id === editingSeanceId);
    Object.assign(s, {titre, date, heure, type, objectif, exercices});
  } else {
    profile.seances.push({id:uid('s'), titre, date, heure, type, objectif, exercices});
  }
  document.getElementById('seanceModal').classList.add('hidden');
  renderAll();
  saveData();
});

// ===================== MODAL COPIER SEANCE =====================
let copyingSeanceId = null;
const copySelected = new Set();

function openCopyModal(seanceId){
  copyingSeanceId = seanceId;
  copySelected.clear();
  const listEl = document.getElementById('copyAthleteList');
  const others = profiles.filter(p => p.id !== currentProfileId);
  if(others.length === 0){
    listEl.innerHTML = '<div class="copy-empty">Aucun autre athlète disponible. Ajoutes-en un depuis la colonne de gauche.</div>';
  } else {
    listEl.innerHTML = '';
    others.forEach(p => {
      const item = document.createElement('label');
      item.className = 'copy-athlete-item';
      item.innerHTML = `
        <input type="checkbox" value="${p.id}">
        <div>
          <div class="name">${p.nom}</div>
          <div class="sub">${p.poste} · ${p.groupe}</div>
        </div>`;
      const checkbox = item.querySelector('input');
      checkbox.addEventListener('change', () => {
        if(checkbox.checked) copySelected.add(p.id);
        else copySelected.delete(p.id);
      });
      listEl.appendChild(item);
    });
  }
  document.getElementById('copyModal').classList.remove('hidden');
}
document.getElementById('copyCancel').addEventListener('click', () => document.getElementById('copyModal').classList.add('hidden'));
document.getElementById('copyConfirm').addEventListener('click', () => {
  if(copySelected.size === 0){ alert('Sélectionne au moins un athlète.'); return; }
  const source = currentProfile();
  const seance = source.seances.find(x => x.id === copyingSeanceId);
  if(!seance){ document.getElementById('copyModal').classList.add('hidden'); return; }
  copySelected.forEach(targetId => {
    const target = profiles.find(p => p.id === targetId);
    if(!target) return;
    const copy = JSON.parse(JSON.stringify(seance));
    copy.id = uid('s');
    target.seances.push(copy);
  });
  document.getElementById('copyModal').classList.add('hidden');
  renderAll();
  saveData();
});

// ===================== MODAL DUPLIQUER A UNE AUTRE DATE =====================
let duplicatingSeanceId = null;
function openDuplicateModal(seanceId){
  duplicatingSeanceId = seanceId;
  const s = currentProfile().seances.find(x => x.id === seanceId);
  document.getElementById('dupDate').value = s.date;
  document.getElementById('dupHeure').value = s.heure;
  document.getElementById('duplicateModal').classList.remove('hidden');
}
document.getElementById('dupCancel').addEventListener('click', () => document.getElementById('duplicateModal').classList.add('hidden'));
document.getElementById('dupConfirm').addEventListener('click', () => {
  const newDate = document.getElementById('dupDate').value;
  if(!newDate){ alert('Choisis une date.'); return; }
  const newHeure = document.getElementById('dupHeure').value || '18:00';
  const profile = currentProfile();
  const seance = profile.seances.find(x => x.id === duplicatingSeanceId);
  if(!seance){ document.getElementById('duplicateModal').classList.add('hidden'); return; }
  const copy = JSON.parse(JSON.stringify(seance));
  copy.id = uid('s');
  copy.date = newDate;
  copy.heure = newHeure;
  profile.seances.push(copy);
  document.getElementById('duplicateModal').classList.add('hidden');
  renderAll();
  saveData();
});

// ===================== INIT =====================
function renderAll(){ renderSidebar(); renderMain(); }

async function init(){
  document.getElementById('mainArea').innerHTML = '<div class="no-profile"><h3>Chargement…</h3><p>Récupération des données.</p></div>';
  const loaded = await loadData();
  if(loaded){
    profiles = loaded;
  } else {
    // Première utilisation : on initialise la base avec les données par défaut
    saveData();
  }
  currentProfileId = profiles[0] ? profiles[0].id : null;
  renderAll();
}
init();
